# budgetsc timeline: the single source of truth for calendar anchors.
# Dates only. Week indices (wID) are always derived with week_of(), never typed.
# Weeks begin on Monday. wID = floor((date - origin) / 7) + 1, so wID 1 is the
# week beginning on `origin`.
origin: 2020-01-06                 # Monday; equals min(week_start) after the first_date filter

events:
  panel_first_date: 2020-01-01     # rows with week_start before this are invalid 2019 data
  feature_created:  2020-06-15     # feature existed (deck/paper "June 2020"); NOT the experiment start
  pilot_start:      2020-08-01     # pilot experiment start, August 2020 -> wID 30. CONFIRM exact day.
  pilot_end:        2021-05-02     # last day before the public launch
  public_launch:    2021-05-03     # Monday, first week of May 2021 -> wID 70
  panel_cutoff:     2022-12-31     # right-censor

horizon:
  n_leads: 40                      # H: post-adoption weeks used for effects and for the donor cutoff
  n_lags_public: 70                # L for public-launch adopters
  n_lags_pilot: 23                 # L for pilot adopters (limited by data before the pilot)
